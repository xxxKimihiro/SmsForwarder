name: Release

# fork 自用：使用仓库内 keystore 签名，无需上游 TOKEN / pppscn/keystore
# - Actions 页手动 Run workflow：打 release APK 并上传 Artifact
# - 推送 v* tag：打包并创建 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: ${{ github.workspace }}/build/app/outputs/apk/release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check signing config
        run: |
          set -euo pipefail
          test -f keystore/keystore.properties
          store_file=$(grep '^storeFile=' keystore/keystore.properties | cut -d= -f2-)
          test -f "$store_file"
          echo "Using keystore: $store_file"

      - name: Build release APKs
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: List outputs
        run: ls -lah "${OUTPUT_DIR}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-release
          path: ${{ env.OUTPUT_DIR }}/SmsF_*_release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SmsForwarder ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.OUTPUT_DIR }}/SmsF_*_release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
