name: Release

# fork 自用：签名来自 GitHub Secrets，不把密钥提交进仓库
# 需要配置：KEYSTORE_BASE64 / KEYSTORE_PASS / ALIAS_NAME / ALIAS_PASS
# - Actions 页手动 Run workflow：打 release APK 并上传 Artifact
# - 推送 v* tag：打包并创建 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: ${{ github.workspace }}/build/app/outputs/apk/release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: jdk

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # AGP 7.2 / Gradle 7.3 用 11 编译；上面 17 只给新版 sdkmanager
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk

      - name: Prepare signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASS}" ] || [ -z "${ALIAS_NAME}" ] || [ -z "${ALIAS_PASS}" ]; then
            echo "Missing signing secrets. Please add repository secrets:"
            echo "  KEYSTORE_BASE64, KEYSTORE_PASS, ALIAS_NAME, ALIAS_PASS"
            exit 1
          fi
          mkdir -p keystore
          echo "${KEYSTORE_BASE64}" | base64 -d > keystore/smsforwarder-self.p12
          {
            echo "keyAlias=${ALIAS_NAME}"
            echo "keyPassword=${ALIAS_PASS}"
            echo "storeFile=keystore/smsforwarder-self.p12"
            echo "storePassword=${KEYSTORE_PASS}"
          } > keystore/keystore.properties
          test -s keystore/smsforwarder-self.p12
          echo "Signing keystore prepared."

      - name: Build release APKs
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: List outputs
        run: ls -lah "${OUTPUT_DIR}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KoSync-release
          path: ${{ env.OUTPUT_DIR }}/KoSync_*_release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KoSync ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.OUTPUT_DIR }}/KoSync_*_release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
