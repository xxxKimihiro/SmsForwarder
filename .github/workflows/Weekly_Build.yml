name: Weekly Build

# fork 自用周构建：不再依赖上游 keystore / XUpdate / secrets.TOKEN
on:
  schedule:
    - cron: '0 15 * * 0' # 每周日 UTC 15:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: ${{ github.workspace }}/build/app/outputs/apk/release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Skip if no recent commits
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          if [ -z "$(git log --since='7 days ago' --oneline)" ]; then
            echo "no recent commits; skip weekly build"
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 11
        if: env.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk

      - name: Setup Android SDK
        if: env.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Check signing config
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          test -f keystore/keystore.properties
          store_file=$(grep '^storeFile=' keystore/keystore.properties | cut -d= -f2-)
          test -f "$store_file"
          echo "Using keystore: $store_file"

      - name: Build release APKs
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        if: env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-weekly
          path: ${{ env.OUTPUT_DIR }}/SmsF_*_release.apk
          if-no-files-found: error
