name: Weekly Build

# fork 自用周构建：签名来自 GitHub Secrets
# 需要配置：KEYSTORE_BASE64 / KEYSTORE_PASS / ALIAS_NAME / ALIAS_PASS
on:
  schedule:
    - cron: '0 15 * * 0' # 每周日 UTC 15:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: ${{ github.workspace }}/build/app/outputs/apk/release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Skip if no recent commits
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          if [ -z "$(git log --since='7 days ago' --oneline)" ]; then
            echo "no recent commits; skip weekly build"
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        if: env.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: jdk

      - name: Setup Android SDK
        if: env.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Set up JDK 11
        if: env.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk

      - name: Prepare signing keystore from secrets
        if: env.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASS}" ] || [ -z "${ALIAS_NAME}" ] || [ -z "${ALIAS_PASS}" ]; then
            echo "Missing signing secrets. Please add repository secrets:"
            echo "  KEYSTORE_BASE64, KEYSTORE_PASS, ALIAS_NAME, ALIAS_PASS"
            exit 1
          fi
          mkdir -p keystore
          echo "${KEYSTORE_BASE64}" | base64 -d > keystore/smsforwarder-self.p12
          {
            echo "keyAlias=${ALIAS_NAME}"
            echo "keyPassword=${ALIAS_PASS}"
            echo "storeFile=keystore/smsforwarder-self.p12"
            echo "storePassword=${KEYSTORE_PASS}"
          } > keystore/keystore.properties
          test -s keystore/smsforwarder-self.p12
          echo "Signing keystore prepared."

      - name: Build release APKs
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        if: env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KoSync-weekly
          path: ${{ env.OUTPUT_DIR }}/KoSync_*_release.apk
          if-no-files-found: error
